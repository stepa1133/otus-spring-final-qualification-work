<div id="absences-page">
    <h2>Управление отсутствиями</h2>

    <div id="absences-message"></div>

    <!-- Форма добавления отсутствия -->
    <div class="card mb-4">
        <div class="card-header">Добавить отсутствие сотрудника</div>
        <div class="card-body">
            <form id="absence-form">
                <div class="mb-3">
                    <label for="absence-employee" class="form-label">Сотрудник</label>
                    <select class="form-control" id="absence-employee" required>
                        <option value="">Загрузка...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="absence-type" class="form-label">Тип отсутствия</label>
                    <select class="form-control" id="absence-type" required>
                        <option value="SICK_LEAVE">Больничный</option>
                        <option value="VACATION">Отпуск</option>
                        <option value="TIME_OFF">Отгул</option>
                    </select>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label for="absence-start" class="form-label">Дата начала</label>
                        <input type="date" class="form-control" id="absence-start" required>
                    </div>
                    <div class="col">
                        <label for="absence-end" class="form-label">Дата окончания</label>
                        <input type="date" class="form-control" id="absence-end" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="absence-reason" class="form-label">Причина</label>
                    <input type="text" class="form-control" id="absence-reason" placeholder="Необязательно">
                </div>
                <button type="submit" class="btn btn-primary">Добавить отсутствие</button>
            </form>
        </div>
    </div>

    <!-- Список отсутствий -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            Отсутствия сотрудников
            <select class="form-select w-auto" id="absence-employee-filter" onchange="loadAbsencesByEmployee(this.value)">
                <option value="">Выберите сотрудника</option>
            </select>
        </div>
        <div class="card-body">
            <div id="absences-list">
                <p class="text-muted">Выберите сотрудника для просмотра его отсутствий</p>
            </div>
        </div>
    </div>
</div>
