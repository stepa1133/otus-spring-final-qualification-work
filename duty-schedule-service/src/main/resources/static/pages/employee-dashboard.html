<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница сотрудника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<script>
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        window.location.href = '/pages/login.html';
    }
</script>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Графики дежурств</a>
        <div class="ms-auto">
            <span class="navbar-text me-3" id="user-info"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Выйти</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div id="employee-dashboard">
        <h2>Мои графики дежурств</h2>

        <div id="employee-message"></div>

        <div class="card mb-4">
            <div class="card-header">Выберите сотрудника</div>
            <div class="card-body">
                <select class="form-select" id="employee-selector" onchange="loadEmployeeSchedules()">
                    <option value="">Выберите себя из списка</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Графики дежурств</div>
            <div class="card-body">
                <div id="employee-schedules-list">
                    <p class="text-muted">Выберите сотрудника для просмотра графиков</p>
                </div>
            </div>
        </div>

        <div class="modal fade" id="employeeScheduleModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="employeeScheduleModalTitle">График</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="employeeScheduleModalBody">
                        Загрузка...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>

<script>
    document.getElementById('user-info').textContent =
        localStorage.getItem('username') + ' (' + localStorage.getItem('user_role') + ')';

    async function loadEmployeeSelector() {
        try {
            const employees = await apiRequest('employees', 'GET');
            const selector = document.getElementById('employee-selector');

            if (employees && employees.length > 0) {
                selector.innerHTML = '<option value="">Выберите себя из списка</option>' +
                    employees.map(emp =>
                        `<option value="${emp.id}">${emp.fullName} (${emp.email})</option>`
                    ).join('');
            }
        } catch (error) {
            document.getElementById('employee-message').innerHTML =
                `<div class="alert alert-danger">Ошибка загрузки: ${error.message}</div>`;
        }
    }

    async function loadEmployeeSchedules() {
        const employeeId = document.getElementById('employee-selector').value;
        const container = document.getElementById('employee-schedules-list');

        if (!employeeId) {
            container.innerHTML = '<p class="text-muted">Выберите сотрудника для просмотра графиков</p>';
            return;
        }

        container.innerHTML = '<p class="text-muted">Загрузка...</p>';

        try {
            const schedules = await apiRequest(`duty-groups?employeeId=${employeeId}`, 'GET');

            if (schedules && schedules.length > 0) {
                container.innerHTML = schedules.map(schedule => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>${schedule.name || 'График'}</h5>
                            <p>Период: ${schedule.startDate || ''} - ${schedule.endDate || ''}</p>
                            <p>Статус: ${schedule.status || ''}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-muted">Графики не найдены</p>';
            }
        } catch (error) {
            container.innerHTML =
                `<div class="alert alert-danger">Ошибка загрузки: ${error.message}</div>`;
        }
    }

    loadEmployeeSelector();
</script>

</body>
</html>
