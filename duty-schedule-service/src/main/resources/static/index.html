<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления графиками дежурств</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Графики дежурств</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav" id="nav-menu">
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="departments">Отделы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="employees">Сотрудники</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="absences">Отсутствия</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="schedules">Графики</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="employee-dashboard">Сотруднику</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="main-content">
    <h1>Добро пожаловать в систему управления графиками дежурств</h1>
    <p>Выберите раздел в меню для начала работы.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/departments.js"></script>
<script src="js/employees.js"></script>
<script src="js/absences.js"></script>
<script src="js/schedules.js"></script>
<script src="js/employee-dashboard.js"></script>
<script>
    document.getElementById('nav-menu').addEventListener('click', function(e) {
        if (e.target.tagName === 'A' && e.target.dataset.page) {
            e.preventDefault();
            const page = e.target.dataset.page;

            if (page === 'departments') {
                loadDepartmentsPage();
            } else if (page === 'employees') {
                loadEmployeesPage();
            } else if (page === 'absences') {
                loadAbsencesPage();
            } else if (page === 'schedules') {
                loadSchedulesPage();
            } else if (page === 'employee-dashboard') {
                loadEmployeeDashboardPage();
            } else {
                document.getElementById('main-content').innerHTML =
                    `<h2>Раздел "${page}" в разработке</h2>`;
            }
        }
    });
</script>

</body>
</html>
