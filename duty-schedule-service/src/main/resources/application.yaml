spring:
  application:
    name: duty-schedule-service
  datasource:
    url: jdbc:postgresql://localhost:5432/duty_schedule_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  shell:
    interactive:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

logging:
  file:
    path: logs
  logback:
    rollingpolicy:
      clean-history-on-start: true
      max-file-size: 10MB
      max-history: 7
  level:
    ru.otus.dutyschedule: DEBUG
    org.hibernate.SQL: DEBUG
    root: WARN