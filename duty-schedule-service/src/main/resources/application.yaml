spring:
  info:
    app:
      name: "Система управления графиками дежурств"
      version: "1.0.0"
      description: "Дипломный проект OTUS Spring"
  application:
    name: duty-schedule-service
  datasource:
    url: jdbc:postgresql://localhost:5432/duty_schedule_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  shell:
    interactive:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,flyway,beans,mappings
  endpoint:
    health:
      show-details: always

logging:
  file:
    path: logs
  logback:
    rollingpolicy:
      clean-history-on-start: true
      max-file-size: 10MB
      max-history: 7
  level:
    ru.otus.dutyschedule: DEBUG
    org.hibernate.SQL: DEBUG
    root: WARN
